<form id="formPendaftaran">

    <!-- 01 NOMOR WHATSAPP -->
    <div class="form-group">
        <label for="whatsapp">
            01 — NOMOR WHATSAPP
        </label>

        <input
            type="tel"
            id="whatsapp"
            name="whatsapp"
            placeholder="Contoh: 085856985288"
            inputmode="numeric"
            autocomplete="tel"
            required
        >
    </div>


    <!-- 02 NAMA -->
    <div class="form-group">
        <label for="nama">
            02 — NAMA
        </label>

        <input
            type="text"
            id="nama"
            name="nama"
            placeholder="Nama lengkap"
            autocomplete="name"
            required
        >
    </div>


    <!-- 03 MERK / TIPE SEPEDA MOTOR -->
    <div class="form-group">
        <label for="merk">
            03 — MERK / TIPE SEPEDA MOTOR
        </label>

        <input
            type="text"
            id="merk"
            name="merk"
            placeholder="Contoh: Honda N MAX"
            required
        >
    </div>


    <!-- 04 NOMOR POLISI -->
    <div class="form-group">
        <label for="nopol">
            04 — NOMOR POLISI
        </label>

        <input
            type="text"
            id="nopol"
            name="nopol"
            placeholder="Contoh: AG 2222 KCF"
            style="text-transform: uppercase;"
            required
        >
    </div>


    <!-- TOMBOL -->
    <button
        type="submit"
        id="submitButton"
    >
        DAFTAR SEKARANG
        <span>→</span>
    </button>

</form>
